services:
  - type: web
    name: leadgen-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-db
          property: connectionString
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/playwright
      - key: CORS_ORIGINS
        value: "*"

  - type: worker
    name: leadgen-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python -m app.services.worker # Run as a simple python process
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-db
          property: connectionString
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/playwright

databases:
  - name: leadgen-db
    plan: free
